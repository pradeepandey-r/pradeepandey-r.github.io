# Weekly redeploy so the "live" Alignment Forum highlights stay current.
# The site fetches the two newest AF posts at build time; a rebuild is what
# refreshes them. Requires a Cloudflare Pages deploy hook stored as the
# repo secret CLOUDFLARE_DEPLOY_HOOK (Cloudflare dashboard -> the Pages
# project -> Settings -> Builds & deployments -> Deploy hooks). Without the
# secret the job is a silent no-op, so this file is safe to ship first.
name: Refresh live highlights

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK secret not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
